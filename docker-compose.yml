version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sensorhub-db
    restart: always
    environment:
      POSTGRES_USER: sensor_user
      POSTGRES_PASSWORD: sensor_password
      POSTGRES_DB: sensorhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_user -d sensorhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: sensorhub-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sensor_user:sensor_password@db:5432/sensorhub_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: